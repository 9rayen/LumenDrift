# Builds LumenDrift.ipa on a free GitHub-hosted Mac (no Mac needed on your side).
# Run it from the "Actions" tab → "Build iPhone app" → "Run workflow".
# Download the result from the finished run's "Artifacts" section, then install it with Sideloadly.
name: Build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned — Sideloadly signs it with your Apple ID)
        run: |
          xcodebuild \
            -project LumenDrift.xcodeproj \
            -scheme LumenDrift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LumenDrift.app Payload/
          zip -qr LumenDrift.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LumenDrift-ipa
          path: LumenDrift.ipa
